openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tennis
    description: Tennis match scoring
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /matches:
    get:
      operationId: listMatches
      tags: [tennis]
      summary: List recent tennis matches
      responses:
        "200":
          description: Match list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchListItem"
    post:
      operationId: createMatch
      tags: [tennis]
      summary: Create a set scoring session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchInput"
      responses:
        "201":
          description: Match created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
  /matches/device-sync:
    post:
      operationId: syncDeviceMatch
      tags: [tennis]
      summary: Create or update a private device-synced match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceSyncMatchInput"
      responses:
        "200":
          description: Device match is ready for point synchronization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSyncMatchResult"
        "400":
          description: Invalid match data
        "401":
          description: Device sync credential is invalid
  /matches/{id}/sync-points:
    post:
      operationId: syncDevicePoints
      tags: [tennis]
      summary: Synchronize an ordered batch of device-recorded points
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Match-Sync-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceSyncPointsInput"
      responses:
        "200":
          description: Points accepted through the returned sequence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSyncPointsResult"
        "400":
          description: Invalid point data
        "401":
          description: Device sync credential is invalid
        "409":
          description: Point order or idempotency key conflicts with stored data
  /matches/{id}/sync-points/{pointId}:
    delete:
      operationId: deleteSyncedDevicePoint
      tags: [tennis]
      summary: Remove an undone device point from the end of the synchronized log
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pointId
          in: path
          required: true
          schema:
            type: string
        - name: X-Match-Sync-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Point deletion acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePointDeleteResult"
        "401":
          description: Device sync credential is invalid
        "409":
          description: Only the latest point can be removed
  /matches/{id}:
    get:
      operationId: getMatch
      tags: [tennis]
      summary: Get a match and its point log
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Match with point history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "404":
          description: Match not found
  /matches/{id}/points:
    post:
      operationId: recordPoint
      tags: [tennis]
      summary: Record a point in the live match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PointInput"
      responses:
        "201":
          description: Point recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "404":
          description: Match not found
        "409":
          description: Match is already complete
  /matches/{id}/points/latest:
    delete:
      operationId: undoLatestPoint
      tags: [tennis]
      summary: Undo the latest point
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "404":
          description: Match or point not found
  /matches/{id}/insights:
    get:
      operationId: getMatchInsights
      tags: [tennis]
      summary: Summarize point patterns for a match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Point pattern summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchInsights"
        "404":
          description: Match not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MatchInput:
      type: object
      properties:
        matchDate:
          type: string
          format: date
        event:
          type: ["string", "null"]
        round:
          type: ["string", "null"]
        setNumber:
          type: integer
          minimum: 1
          default: 1
        trackedPlayer:
          type: string
          minLength: 1
        opponent:
          type: string
          minLength: 1
        chairCoach:
          type: ["string", "null"]
        surface:
          type: string
          enum: [Hard, Clay, Grass, Carpet, Other]
        firstServer:
          type: string
          enum: [tracked, opponent]
      required: [matchDate, trackedPlayer, opponent, surface, firstServer]
    PointInput:
      type: object
      properties:
        winner:
          type: string
          enum: [tracked, opponent]
        endingCode:
          type: ["string", "null"]
          enum: [A, F, B, V, O, P, N, L, W, D, FE, null]
        firstServeFault:
          type: boolean
          default: false
      required: [winner]
    DeviceSyncMatchInput:
      type: object
      properties:
        clientMatchId:
          type: string
          minLength: 1
          maxLength: 128
        syncToken:
          type: string
          minLength: 20
          maxLength: 256
        matchDate:
          type: string
          format: date
        event:
          type: ["string", "null"]
        round:
          type: ["string", "null"]
        setNumber:
          type: integer
          minimum: 1
        trackedPlayer:
          type: string
          minLength: 1
        opponent:
          type: string
          minLength: 1
        chairCoach:
          type: ["string", "null"]
        surface:
          type: string
          enum: [Hard, Clay, Grass, Carpet, Other]
        firstServer:
          type: string
          enum: [tracked, opponent]
        status:
          type: string
          enum: [in_progress, complete]
      required:
        - clientMatchId
        - syncToken
        - matchDate
        - setNumber
        - trackedPlayer
        - opponent
        - surface
        - firstServer
        - status
    DeviceSyncMatchResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clientMatchId:
          type: string
        pointCount:
          type: integer
        nextSequence:
          type: integer
      required: [id, clientMatchId, pointCount, nextSequence]
    DeviceSyncPoint:
      type: object
      properties:
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 128
        sequenceNumber:
          type: integer
          minimum: 1
        setNumber:
          type: integer
          minimum: 1
        gameNumber:
          type: integer
          minimum: 1
        server:
          type: string
          enum: [tracked, opponent]
        isTiebreak:
          type: boolean
        winner:
          type: string
          enum: [tracked, opponent]
        endingCode:
          type: ["string", "null"]
          enum: [A, F, B, V, O, P, N, L, W, D, FE, null]
        firstServeFault:
          type: boolean
      required:
        - idempotencyKey
        - sequenceNumber
        - setNumber
        - gameNumber
        - server
        - isTiebreak
        - winner
        - firstServeFault
    DeviceSyncPointsInput:
      type: object
      properties:
        points:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/DeviceSyncPoint"
      required: [points]
    DeviceSyncPointsResult:
      type: object
      properties:
        pointCount:
          type: integer
        nextSequence:
          type: integer
      required: [pointCount, nextSequence]
    DevicePointDeleteResult:
      type: object
      properties:
        deleted:
          type: boolean
        pointCount:
          type: integer
        nextSequence:
          type: integer
      required: [deleted, pointCount, nextSequence]
    Point:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sequenceNumber:
          type: integer
        setNumber:
          type: integer
        gameNumber:
          type: integer
        server:
          type: string
          enum: [tracked, opponent]
        isTiebreak:
          type: boolean
        winner:
          type: string
          enum: [tracked, opponent]
        endingCode:
          type: ["string", "null"]
          enum: [A, F, B, V, O, P, N, L, W, D, FE, null]
        firstServeFault:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, sequenceNumber, setNumber, gameNumber, server, isTiebreak, winner, firstServeFault, createdAt]
    Score:
      type: object
      properties:
        trackedGames:
          type: integer
        opponentGames:
          type: integer
        trackedPoints:
          type: string
        opponentPoints:
          type: string
        trackedTiebreakPoints:
          type: integer
        opponentTiebreakPoints:
          type: integer
        nextServer:
          type: string
          enum: [tracked, opponent]
        isTiebreak:
          type: boolean
        isComplete:
          type: boolean
        winner:
          type: ["string", "null"]
          enum: [tracked, opponent, null]
      required: [trackedGames, opponentGames, trackedPoints, opponentPoints, trackedTiebreakPoints, opponentTiebreakPoints, nextServer, isTiebreak, isComplete]
    Match:
      type: object
      properties:
        id:
          type: string
          format: uuid
        matchDate:
          type: string
          format: date
        event:
          type: ["string", "null"]
        round:
          type: ["string", "null"]
        setNumber:
          type: integer
        trackedPlayer:
          type: string
        opponent:
          type: string
        chairCoach:
          type: ["string", "null"]
        surface:
          type: string
          enum: [Hard, Clay, Grass, Carpet, Other]
        firstServer:
          type: string
          enum: [tracked, opponent]
        status:
          type: string
          enum: [in_progress, complete]
        score:
          $ref: "#/components/schemas/Score"
        points:
          type: array
          items:
            $ref: "#/components/schemas/Point"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, matchDate, setNumber, trackedPlayer, opponent, surface, firstServer, status, score, points, createdAt, updatedAt]
    MatchListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        matchDate:
          type: string
          format: date
        event:
          type: ["string", "null"]
        round:
          type: ["string", "null"]
        setNumber:
          type: integer
        trackedPlayer:
          type: string
        opponent:
          type: string
        surface:
          type: string
          enum: [Hard, Clay, Grass, Carpet, Other]
        status:
          type: string
          enum: [in_progress, complete]
        trackedGames:
          type: integer
        opponentGames:
          type: integer
        pointCount:
          type: integer
        winner:
          type: ["string", "null"]
          enum: [tracked, opponent, null]
        updatedAt:
          type: string
          format: date-time
      required: [id, matchDate, setNumber, trackedPlayer, opponent, surface, status, trackedGames, opponentGames, pointCount, updatedAt]
    MatchInsights:
      type: object
      properties:
        pointCount:
          type: integer
        trackedPointsWon:
          type: integer
        opponentPointsWon:
          type: integer
        firstServeFaults:
          type: integer
        codes:
          type: array
          items:
            $ref: "#/components/schemas/CodeCount"
        returnPointsWon:
          type: integer
        servicePointsWon:
          type: integer
      required: [pointCount, trackedPointsWon, opponentPointsWon, firstServeFaults, codes, returnPointsWon, servicePointsWon]
    CodeCount:
      type: object
      properties:
        code:
          type: string
        count:
          type: integer
        trackedWon:
          type: integer
        opponentWon:
          type: integer
      required: [code, count, trackedWon, opponentWon]
